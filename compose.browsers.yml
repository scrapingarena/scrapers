services:
  obscura:
    profiles: [obscura]
    image: h4ckf0r0day/obscura
    pull_policy: always
    restart: on-failure
    environment:
      - OBSCURA_CDP_TOKEN=${OBSCURA_CDP_TOKEN:?Export OBSCURA_CDP_TOKEN with at least 32 bytes}
      - OBSCURA_PROXY
      - OBSCURA_NAV_TIMEOUT_MS=20000
      - OBSCURA_SCRIPT_DEADLINE_MS=15000
      - OBSCURA_FETCH_TIMEOUT_MS=10000
      - OBSCURA_CDP_COMMAND_TIMEOUT_MS=25000
    shm_size: 2gb
    ports:
      - "127.0.0.1:9222:9222"

  lightpanda:
    profiles: [lightpanda]
    image: lightpanda/browser:nightly
    command: ["lightpanda", "serve", "--host", "0.0.0.0", "--port", "9222"]
    shm_size: 2gb
    ports:
      - "127.0.0.1:9222:9222"

  steel:
    profiles: [steel]
    image: ghcr.io/steel-dev/steel-browser
    shm_size: 2gb
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:9223:9223"
