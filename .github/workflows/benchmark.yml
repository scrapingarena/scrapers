name: Benchmark

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      validator:
        description: "Validation mode"
        type: choice
        options: [deterministic, openai]
        default: deterministic
      limit:
        description: "Optional target limit for a smoke run"
        type: string
        required: false
      concurrency:
        description: "Concurrent URLs per scraper"
        type: number
        default: 10

permissions:
  contents: write

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      scrapers: ${{ steps.matrix.outputs.scrapers }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8
        with:
          version: "0.11.32"
          enable-cache: true
      - run: uv sync --locked
      - id: matrix
        run: echo "scrapers=$(uv run scrapingarena scrapers --json)" >> "$GITHUB_OUTPUT"

  benchmark:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        scraper: ${{ fromJSON(needs.prepare.outputs.scrapers) }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Cache downloaded browser runtimes
        if: ${{ contains(matrix.scraper, 'camoufox') || matrix.scraper == 'cloakbrowser' || matrix.scraper == 'shardbrowser' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/camoufox
            ~/.camoufox
            ~/.cloakbrowser
            ~/.cache/shardx-sdk
          key: browser-${{ runner.os }}-${{ matrix.scraper }}-${{ hashFiles('uv.lock') }}
      - name: Install adapter dependencies
        env:
          SCRAPER: ${{ matrix.scraper }}
          VALIDATOR: ${{ inputs.validator || 'deterministic' }}
        run: |
          extras=()
          case "$SCRAPER" in
            camoufox-original) extras+=(--extra camoufox-original) ;;
            camoufox-fork) extras+=(--extra camoufox-fork) ;;
            cloakbrowser) extras+=(--extra cloakbrowser) ;;
            curl-cffi) extras+=(--extra curl-cffi) ;;
            lightpanda|obscura) extras+=(--extra cdp) ;;
            shardbrowser) extras+=(--extra shardbrowser) ;;
            steel) extras+=(--extra steel) ;;
          esac
          if [ "$VALIDATOR" = "openai" ]; then
            extras+=(--extra openai)
          fi
          uv sync --locked "${extras[@]}"
      - name: Install packaged browser binary
        if: ${{ contains(matrix.scraper, 'camoufox') || matrix.scraper == 'cloakbrowser' }}
        env:
          SCRAPER: ${{ matrix.scraper }}
          CLOAKBROWSER_AUTO_UPDATE: "false"
        run: |
          case "$SCRAPER" in
            camoufox-original) uv run python -m camoufox fetch ;;
            camoufox-fork)
              uv run python -m camoufox sync
              uv run python -m camoufox set official/prerelease
              uv run python -m camoufox fetch
              ;;
            cloakbrowser) uv run python -m cloakbrowser install ;;
          esac
      - name: Start browser service
        if: ${{ matrix.scraper == 'lightpanda' || matrix.scraper == 'obscura' || matrix.scraper == 'steel' }}
        env:
          SCRAPER: ${{ matrix.scraper }}
        run: |
          case "$SCRAPER" in
            lightpanda)
              docker run -d --name scrapingarena-browser --shm-size=2g \
                -p 127.0.0.1:9222:9222 lightpanda/browser:nightly \
                lightpanda serve --host 0.0.0.0 --port 9222
              health_url=http://127.0.0.1:9222/json/version
              ;;
            obscura)
              docker run -d --name scrapingarena-browser --shm-size=2g \
                -p 127.0.0.1:9222:9222 h4ckf0r0day/obscura
              health_url=http://127.0.0.1:9222/json/version
              ;;
            steel)
              docker run -d --name scrapingarena-browser --shm-size=2g \
                -p 127.0.0.1:3000:3000 ghcr.io/steel-dev/steel-browser
              health_url=http://127.0.0.1:3000
              ;;
          esac
          for attempt in {1..60}; do
            if curl --fail --silent "$health_url" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs scrapingarena-browser
          exit 1
      - name: Run scraper shard
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VALIDATOR: ${{ inputs.validator || 'deterministic' }}
          LIMIT: ${{ inputs.limit }}
          URL_CONCURRENCY: ${{ inputs.concurrency || 10 }}
          SCRAPER: ${{ matrix.scraper }}
          SCRAPINGARENA_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          CLOAKBROWSER_AUTO_UPDATE: "false"
          STEEL_BASE_URL: http://127.0.0.1:3000
          SCRAPINGARENA_CDP_ENDPOINT: http://127.0.0.1:9222
        run: |
          effective_concurrency="$URL_CONCURRENCY"
          case "$SCRAPER" in
            cloakbrowser) effective_concurrency=1 ;;
            camoufox-*|lightpanda|obscura|shardbrowser|steel)
              if [ "$effective_concurrency" -gt 4 ]; then
                effective_concurrency=4
              fi
              ;;
          esac
          args=(
            --scraper "$SCRAPER"
            --validator "$VALIDATOR"
            --concurrency "$effective_concurrency"
            --retries 1
            --output-dir "shard-results/$SCRAPER"
          )
          if [ -n "$LIMIT" ]; then
            args+=(--limit "$LIMIT")
          fi
          uv run scrapingarena benchmark "${args[@]}"
      - name: Upload scraper shard
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.scraper }}
          path: shard-results/${{ matrix.scraper }}/latest.json
          retention-days: 14

  aggregate:
    needs: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8
        with:
          version: "0.11.32"
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/download-artifact@v4
        with:
          pattern: benchmark-*
          path: downloaded-shards
      - name: Merge scraper shards
        run: |
          uv run scrapingarena merge downloaded-shards/*/latest.json \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output-dir results
      - name: Upload full report
        uses: actions/upload-artifact@v4
        with:
          name: scrapingarena-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/
          retention-days: 90
      - name: Commit canonical results to the benchmarked branch
        if: ${{ !inputs.limit }}
        run: |
          git config user.name "scrapingarena-bot"
          git config user.email "scrapingarena-bot@users.noreply.github.com"
          git add results/latest.json results/index.json results/runs/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "results: benchmark run ${GITHUB_RUN_ID} [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
