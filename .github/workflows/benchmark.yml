name: Benchmark

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Optional target limit for a smoke run"
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      direct: ${{ steps.matrix.outputs.direct }}
      oxylabs: ${{ steps.matrix.outputs.oxylabs }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        run: |
          echo "direct=$(python3 scripts/benchmark_ci.py matrix --proxy direct)" >> "$GITHUB_OUTPUT"
          echo "oxylabs=$(python3 scripts/benchmark_ci.py matrix --proxy oxylabs)" >> "$GITHUB_OUTPUT"

  benchmark-direct:
    name: ${{ matrix.scraper.slug }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        scraper: ${{ fromJSON(needs.prepare.outputs.direct) }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Cache downloaded browser runtimes
        if: ${{ matrix.scraper.cache_paths != '' }}
        uses: actions/cache@v6
        with:
          path: ${{ matrix.scraper.cache_paths }}
          key: browser-${{ runner.os }}-${{ matrix.scraper.slug }}-${{ hashFiles('uv.lock') }}
      - name: Prepare and run scraper
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SCRAPINGARENA_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          STEEL_BASE_URL: http://127.0.0.1:3000
          SCRAPINGARENA_CDP_ENDPOINT: http://127.0.0.1:9222
        run: |
          python3 scripts/benchmark_ci.py execute \
            --scraper "${{ matrix.scraper.slug }}" \
            --limit "${{ inputs.limit }}"
      - name: Upload scraper shard
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ matrix.scraper.slug }}
          path: shard-results/${{ matrix.scraper.slug }}/latest.json
          retention-days: 14

  benchmark-oxylabs:
    name: ${{ matrix.scraper.slug }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        scraper: ${{ fromJSON(needs.prepare.outputs.oxylabs) }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Cache downloaded browser runtimes
        if: ${{ matrix.scraper.cache_paths != '' }}
        uses: actions/cache@v6
        with:
          path: ${{ matrix.scraper.cache_paths }}
          key: browser-${{ runner.os }}-${{ matrix.scraper.slug }}-${{ hashFiles('uv.lock') }}
      - name: Prepare and run scraper
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OXYLABS_RESIDENTIAL_PROXIES_USERNAME: ${{ secrets.OXYLABS_RESIDENTIAL_PROXIES_USERNAME }}
          OXYLABS_RESIDENTIAL_PROXIES_PASSWORD: ${{ secrets.OXYLABS_RESIDENTIAL_PROXIES_PASSWORD }}
          SCRAPINGARENA_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          STEEL_BASE_URL: http://127.0.0.1:3000
          SCRAPINGARENA_CDP_ENDPOINT: http://127.0.0.1:9222
        run: |
          python3 scripts/benchmark_ci.py execute \
            --scraper "${{ matrix.scraper.slug }}" \
            --limit "${{ inputs.limit }}"
      - name: Upload scraper shard
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ matrix.scraper.slug }}
          path: shard-results/${{ matrix.scraper.slug }}/latest.json
          retention-days: 14

  aggregate:
    needs: [benchmark-direct, benchmark-oxylabs]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.32"
          enable-cache: true
      - uses: actions/download-artifact@v8
        with:
          pattern: benchmark-*
          path: downloaded-shards
      - name: Merge and publish results
        run: |
          python3 scripts/benchmark_ci.py aggregate \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --ref "${GITHUB_REF_NAME}" \
            --limit "${{ inputs.limit }}"
      - name: Upload full report
        uses: actions/upload-artifact@v7
        with:
          name: scrapingarena-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/
          retention-days: 90
