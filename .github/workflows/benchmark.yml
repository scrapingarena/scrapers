name: Benchmark

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      validator:
        description: "Validation mode"
        type: choice
        options: [deterministic, openai]
        default: deterministic
      limit:
        description: "Optional target limit for a smoke run"
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      scrapers: ${{ steps.matrix.outputs.scrapers }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        run: echo "scrapers=$(python3 scripts/benchmark_ci.py matrix)" >> "$GITHUB_OUTPUT"

  benchmark:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        scraper: ${{ fromJSON(needs.prepare.outputs.scrapers) }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Cache downloaded browser runtimes
        if: ${{ matrix.scraper.cache_paths != '' }}
        uses: actions/cache@v4
        with:
          path: ${{ matrix.scraper.cache_paths }}
          key: browser-${{ runner.os }}-${{ matrix.scraper.slug }}-${{ hashFiles('uv.lock') }}
      - name: Prepare and run scraper
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SCRAPINGARENA_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          STEEL_BASE_URL: http://127.0.0.1:3000
          SCRAPINGARENA_CDP_ENDPOINT: http://127.0.0.1:9222
        run: |
          python3 scripts/benchmark_ci.py execute \
            --scraper "${{ matrix.scraper.slug }}" \
            --validator "${{ inputs.validator || 'deterministic' }}" \
            --limit "${{ inputs.limit }}"
      - name: Upload scraper shard
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.scraper.slug }}
          path: shard-results/${{ matrix.scraper.slug }}/latest.json
          retention-days: 14

  aggregate:
    needs: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true
      - uses: actions/download-artifact@v4
        with:
          pattern: benchmark-*
          path: downloaded-shards
      - name: Merge and publish results
        run: |
          python3 scripts/benchmark_ci.py aggregate \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --ref "${GITHUB_REF_NAME}" \
            --limit "${{ inputs.limit }}"
      - name: Upload full report
        uses: actions/upload-artifact@v4
        with:
          name: scrapingarena-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/
          retention-days: 90
