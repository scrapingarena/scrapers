name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run scrapingarena doctor

  vercel-agent-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: uv sync --locked
      - run: npm install --global agent-browser@0.37.1
      - run: agent-browser install --with-deps
      - run: uv run python scripts/smoke_vercel_agent_browser.py

  native-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scraper: [patchright, moli]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
      - if: matrix.scraper == 'patchright'
        run: |
          uv sync --locked --extra patchright
          sudo apt-get update
          sudo apt-get install -y xvfb
          uv run patchright install --with-deps chrome
          xvfb-run -a uv run python scripts/smoke_browser.py --scraper patchright
      - if: matrix.scraper == 'moli'
        run: |
          uv sync --locked
          uv run python scripts/install_moli.py
          uv run python scripts/smoke_browser.py --scraper moli
