name: Benchmark test (no publishing)

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      scrapers:
        description: "Comma-separated scraper slugs, or all"
        type: string
        required: true
        default: "all"
      proxies:
        description: "Comma-separated: direct, oxylabs, nodemaven-filtered, nodemaven-unfiltered"
        type: string
        required: true
        default: "nodemaven-filtered,nodemaven-unfiltered"
      limit:
        description: "Target limit per variant (blank runs all targets)"
        type: string
        required: false
        default: ""

# Defaults for label-triggered PR tests. Edit these on your branch as needed.
env:
  PR_TEST_SCRAPERS: all
  PR_TEST_PROXIES: nodemaven-filtered,nodemaven-unfiltered
  PR_TEST_LIMIT: ""

permissions:
  contents: read

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'benchmark-test' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        env:
          SELECTED_SCRAPERS: ${{ github.event_name == 'pull_request' && env.PR_TEST_SCRAPERS || inputs.scrapers }}
          SELECTED_PROXIES: ${{ github.event_name == 'pull_request' && env.PR_TEST_PROXIES || inputs.proxies }}
        run: |
          matrix=$(python3 scripts/benchmark_test_ci.py matrix --scrapers "$SELECTED_SCRAPERS" --proxies "$SELECTED_PROXIES")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  benchmark-test:
    name: test-${{ matrix.scraper }}-${{ matrix.variant }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true
      - uses: actions/setup-node@v4
        if: ${{ matrix.scraper == 'vercel-agent-browser' }}
        with:
          node-version: "24"
      - name: Cache downloaded browser runtimes
        if: ${{ matrix.cache_paths != '' }}
        uses: actions/cache@v4
        with:
          path: ${{ matrix.cache_paths }}
          key: browser-${{ runner.os }}-${{ matrix.slug }}-${{ hashFiles('uv.lock') }}
      - name: Run temporary benchmark
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NODEMAVEN_USERNAME: ${{ secrets.NODEMAVEN_USERNAME }}
          NODEMAVEN_PASSWORD: ${{ secrets.NODEMAVEN_PASSWORD }}
          OXYLABS_PROXIES_USERNAME: ${{ secrets.OXYLABS_PROXIES_USERNAME }}
          OXYLABS_PROXIES_PASSWORD: ${{ secrets.OXYLABS_PROXIES_PASSWORD }}
          OXYLABS_RESIDENTIAL_PROXIES_USERNAME: ${{ secrets.OXYLABS_RESIDENTIAL_PROXIES_USERNAME }}
          OXYLABS_RESIDENTIAL_PROXIES_PASSWORD: ${{ secrets.OXYLABS_RESIDENTIAL_PROXIES_PASSWORD }}
          SCRAPINGARENA_RUN_ID: test-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.variant }}
          STEEL_BASE_URL: http://127.0.0.1:3000
          SCRAPINGARENA_CDP_ENDPOINT: http://127.0.0.1:9222
          SELECTED_SCRAPER: ${{ matrix.scraper }}
          SELECTED_VARIANT: ${{ matrix.variant }}
          TARGET_LIMIT: ${{ github.event_name == 'pull_request' && env.PR_TEST_LIMIT || inputs.limit }}
        run: |
          python3 scripts/benchmark_test_ci.py execute \
            --scraper "$SELECTED_SCRAPER" \
            --variant "$SELECTED_VARIANT" \
            --limit "$TARGET_LIMIT"
