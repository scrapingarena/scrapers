[project]
name = "scrapingarena"
version = "0.1.0"
description = "Reproducible benchmarks for Python web scrapers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.11,<3",
  "typer>=0.16,<1",
  "wreq>=0.7,<1",
]

[project.optional-dependencies]
camoufox-fork = ["cloverlabs-camoufox>=0.4,<1"]
camoufox-original = ["camoufox>=0.4,<1"]
cdp = ["playwright>=1.55,<2"]
cloakbrowser = ["cloakbrowser>=0.3,<1"]
curl-cffi = ["curl-cffi>=0.14,<1"]
openai = ["openai>=1.99,<2"]
shardbrowser = ["shardx>=0.1,<1"]
steel = ["steel-sdk>=0.1,<1"]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
scrapingarena = "scrapingarena.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scrapingarena"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["camoufox.*", "cloakbrowser", "curl_cffi.*", "openai.*", "playwright.*", "shardx.*", "steel.*"]
ignore_missing_imports = true
